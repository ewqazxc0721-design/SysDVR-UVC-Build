name: Build SysDVR-UVC iPad A5 ORIG DIAG

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip python3

      - name: Clone exact upstream baseline
        run: |
          git clone https://github.com/Insektaure/SysDVR-UVC-Capture.git /work/a5
          cd /work/a5
          git checkout d7212ca0942e2782c65c6002d85364687d73c9df

      - name: Add raw USB state monitor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/work/a5/source/sysmodule/main.c')
          s = p.read_text()

          marker = 'static volatile bool g_running = true;\n'
          helper = '''\n\n// A5-ORIG-DIAG: raw usb:ds state monitor on untouched upstream USB descriptors.\nstatic const char* A5UsbStateName(UsbState state)\n{\n    switch (state) {\n        case UsbState_Detached:   return "Detached";\n        case UsbState_Attached:   return "Attached";\n        case UsbState_Powered:    return "Powered";\n        case UsbState_Default:    return "Default";\n        case UsbState_Address:    return "Address";\n        case UsbState_Configured: return "Configured";\n        case UsbState_Suspended:  return "Suspended";\n        default:                  return "Unknown";\n    }\n}\n'''
          if marker not in s:
              raise SystemExit('g_running marker missing')
          s = s.replace(marker, marker + helper, 1)

          old = '''    // Main thread just sleeps - all work is done in streaming threads\n    while (g_running) {\n        svcSleepThread(1E+9);  // 1 second\n    }\n'''
          new = '''    // A5-ORIG-DIAG: preserve the exact upstream USB descriptors, but poll\n    // the raw usb:ds state so we can see whether iPad reaches Configured.\n    LOG("A5-ORIG-DIAG raw USB monitor active (1ms poll, 1s heartbeat)\\n");\n    UsbState a5LastState = (UsbState)0xFF;\n    bool a5HaveState = false;\n    bool a5HadGetStateError = false;\n    u32 a5Heartbeat = 0;\n    u32 a5Sequence = 0;\n\n    while (g_running) {\n        UsbState state = UsbState_Detached;\n        Result stateRc = usbDsGetState(&state);\n\n        if (R_FAILED(stateRc)) {\n            if (!a5HadGetStateError) {\n                LOG("A5 USB get-state ERROR rc=0x%x\\n", stateRc);\n                a5HadGetStateError = true;\n            }\n        } else {\n            a5HadGetStateError = false;\n            if (!a5HaveState || state != a5LastState) {\n                UsbDeviceSpeed speed = UsbDeviceSpeed_None;\n                Result speedRc = usbDsGetSpeed(&speed);\n                LOG("A5 USB state #%u: %u (%s), speed=%u, speedRc=0x%x\\n",\n                    a5Sequence++, (unsigned)state, A5UsbStateName(state),\n                    (unsigned)speed, speedRc);\n                a5LastState = state;\n                a5HaveState = true;\n            }\n\n            if (++a5Heartbeat >= 1000) {\n                LOG("A5 heartbeat: state=%u (%s)\\n",\n                    (unsigned)state, A5UsbStateName(state));\n                a5Heartbeat = 0;\n            }\n        }\n\n        svcSleepThread(1E+6);\n    }\n'''
          if old not in s:
              raise SystemExit('main sleep loop marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Make FileLogging thread-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/work/a5/source/core.c')
          s = p.read_text()

          old = 'static FsFileSystem g_sdCard;\nstatic bool g_sdMounted = false;\n'
          new = 'static FsFileSystem g_sdCard;\nstatic bool g_sdMounted = false;\nstatic Mutex g_fileLogMutex = 0;\n'
          if old not in s:
              raise SystemExit('file logging globals marker missing')
          s = s.replace(old, new, 1)

          start = s.index('void LogFunctionImpl(const char* fmt, ...)\n{', s.index('#elif FILE_LOGGING'))
          end = s.index('\n}\n#endif', start) + 2
          repl = '''void LogFunctionImpl(const char* fmt, ...)\n{\n    if (!g_sdMounted) return;\n\n    mutexLock(&g_fileLogMutex);\n\n    char buf[512];\n    va_list args;\n    va_start(args, fmt);\n    int len = vsnprintf(buf, sizeof(buf), fmt, args);\n    va_end(args);\n\n    if (len > 0) {\n        FsFile file;\n        if (R_SUCCEEDED(fsFsOpenFile(&g_sdCard, "/logfile.txt", FsOpenMode_Write | FsOpenMode_Append, &file))) {\n            s64 offset = 0;\n            fsFileGetSize(&file, &offset);\n            fsFileWrite(&file, offset, buf, len, FsWriteOption_Flush);\n            fsFileClose(&file);\n        }\n    }\n\n    mutexUnlock(&g_fileLogMutex);\n}'''
          s = s[:start] + repl + s[end:]
          p.write_text(s)
          PY

      - name: Verify original USB descriptor baseline preserved
        run: |
          set -e
          cd /work/a5
          grep -n 'usbDsSetUsbDeviceDescriptor(UsbDeviceSpeed_Super' source/uvc/uvc_device.c
          grep -n 'usbDsSetBinaryObjectStore' source/uvc/uvc_device.c
          grep -n 'Super Speed VC' source/uvc/uvc_device.c
          grep -n 'Super Speed VS' source/uvc/uvc_device.c
          grep -n 'A5-ORIG-DIAG' source/sysmodule/main.c
          git diff -- source/sysmodule/main.c source/core.c

      - name: Build A5 ORIG DIAG FileLogging
        run: |
          set -e
          cd /work/a5
          make clean || true
          make -j"$(nproc)" DEFINES="-DFILE_LOGGING"
          test -s exefs.nsp
          OUT=/out/a5/atmosphere/contents/00FF0000A53BB666
          mkdir -p "$OUT"
          cp exefs.nsp "$OUT/exefs.nsp"
          cp toolbox.json "$OUT/toolbox.json"
          cp -R flags "$OUT/flags"
          cd /out/a5
          zip -r /out/SysDVR-UVC-iPad-A5_ORIG_DIAG_FileLogging.zip atmosphere

      - name: Verify package
        run: |
          set -e
          ls -lh /out/SysDVR-UVC-iPad-A5_ORIG_DIAG_FileLogging.zip
          unzip -l /out/SysDVR-UVC-iPad-A5_ORIG_DIAG_FileLogging.zip

      - name: Upload A5 ORIG DIAG
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-UVC-iPad-A5-ORIG-DIAG-FileLogging
          path: /out/SysDVR-UVC-iPad-A5_ORIG_DIAG_FileLogging.zip
          if-no-files-found: error
