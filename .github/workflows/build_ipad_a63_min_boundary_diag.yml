name: Build SysDVR-UVC iPad A6.3 MIN Boundary DIAG

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip python3

      - name: Clone exact upstream baseline
        run: |
          git clone https://github.com/Insektaure/SysDVR-UVC-Capture.git /work/a63
          cd /work/a63
          git checkout d7212ca0942e2782c65c6002d85364687d73c9df

      - name: Apply A6.1 native H264 patch
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/a61_patch.py" /work/a63

      - name: Apply A6.3 MIN boundary patch
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/a63_min_boundary.py" /work/a63

      - name: Verify A6.3 instrumentation
        run: |
          set -e
          cd /work/a63
          grep -n 'A6.3 append' source/uvc/uvc_device.c
          grep -n 'A6.3 OMIT HS color' source/uvc/uvc_device.c
          grep -n 'HS endpoint' source/uvc/uvc_device.c
          grep -n 'advertisedCSNoColor' source/uvc/uvc_device.c
          grep -n 'A6.3-MIN-NATIVE-H264-BOUNDARY-DIAG' source/sysmodule/main.c

      - name: Build A6.3 FileLogging
        run: |
          set -e
          cd /work/a63
          make clean || true
          make -j"$(nproc)" DEFINES="-DFILE_LOGGING"
          test -s exefs.nsp
          OUT=/out/a63/atmosphere/contents/00FF0000A53BB666
          mkdir -p "$OUT"
          cp exefs.nsp "$OUT/exefs.nsp"
          cp toolbox.json "$OUT/toolbox.json"
          cp -R flags "$OUT/flags"
          cd /out/a63
          zip -r /out/SysDVR-UVC-iPad-A63_MIN_NATIVE_H264_BOUNDARY_DIAG_FileLogging.zip atmosphere

      - name: Verify package
        run: |
          ls -lh /out/SysDVR-UVC-iPad-A63_MIN_NATIVE_H264_BOUNDARY_DIAG_FileLogging.zip
          unzip -l /out/SysDVR-UVC-iPad-A63_MIN_NATIVE_H264_BOUNDARY_DIAG_FileLogging.zip

      - name: Upload A6.3
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-UVC-iPad-A63-MIN-NATIVE-H264-BOUNDARY-DIAG-FileLogging
          path: /out/SysDVR-UVC-iPad-A63_MIN_NATIVE_H264_BOUNDARY_DIAG_FileLogging.zip
          if-no-files-found: error
