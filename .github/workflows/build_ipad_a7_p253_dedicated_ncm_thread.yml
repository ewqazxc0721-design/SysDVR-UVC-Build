name: Build A7 P2.5.3 Dedicated NCM Thread

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_ipad_a7_p253_dedicated_ncm_thread.yml'
      - 'scripts/a7_p253_dedicated_ncm_thread_patch.py'
      - 'scripts/a7_p253_overlay_version_patch.py'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip python3 binutils

      - name: Clone pinned sources
        run: |
          git clone https://github.com/exelix11/SysDVR.git /work/sysdvr
          git -C /work/sysdvr checkout v6.3
          git clone https://github.com/Insektaure/SysDVR-UVC-Capture.git /work/ncmref
          git -C /work/ncmref checkout d7212ca0942e2782c65c6002d85364687d73c9df
          git clone https://github.com/Hartie95/sysdvr-overlay.git /work/sysdvr-overlay
          git -C /work/sysdvr-overlay checkout 8aded84c262cc59b91118c194f53c911100d154d
          git -C /work/sysdvr-overlay submodule update --init --recursive

      - name: Apply patches through P2.5.3
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/a7_p0_ncm_diag_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p01_ncm_rx_fix_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p02_ncm_ipv4_poc_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_ncm_tcp_video_patch.py" /work/sysdvr/sysmodule /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_filelogging_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_audio_ipc_logging_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_compile_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p21_perf_reliability_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p211_runtime_marker_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p212_control_flush_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p22_tcp_retransmit_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p221_burst_retransmit_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p23_ipad_usb_mode_patch.py" /work/sysdvr
          python3 "$GITHUB_WORKSPACE/scripts/a7_p231_config_api18_compat_patch.py" /work/sysdvr
          python3 "$GITHUB_WORKSPACE/scripts/a7_p24_ncm_rx_audio_latency_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p25_audio_fast_recovery_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p251_usb_staged_transition_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p252_discovery_audio_pump_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p253_dedicated_ncm_thread_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p232_overlay_ipad_usb_patch.py" /work/sysdvr-overlay
          python3 "$GITHUB_WORKSPACE/scripts/a7_p252_overlay_ip_patch.py" /work/sysdvr-overlay
          python3 "$GITHUB_WORKSPACE/scripts/a7_p253_overlay_version_patch.py" /work/sysdvr-overlay

      - name: Verify P2.5.3 source changes
        run: |
          set -e
          grep -n '#define SYSDVR_IPC_VERSION 18' /work/sysdvr/sysmodule/source/modes/defines.h
          grep -n '#define TYPE_MODE_IPAD_USB 5' /work/sysdvr/sysmodule/source/modes/defines.h
          grep -n 'A7P253NetworkThread' /work/sysdvr/sysmodule/source/ncm/NCMmode.c
          grep -n 'NET_THREAD=1 NET_POLL_US=500' /work/sysdvr/sysmodule/source/ncm/NCMmode.c
          test "$(grep -c 'NcmDeviceProcessRequests();' /work/sysdvr/sysmodule/source/ncm/NCMmode.c)" = 1
          test "$(grep -c 'NcmDeviceProcessRequests();' /work/sysdvr/sysmodule/source/ncm/ncm_device.c || true)" = 0
          grep -n 'static _Atomic A7TcpState g_tcpState' /work/sysdvr/sysmodule/source/ncm/ncm_device.c
          grep -n 'static _Atomic A7TcpState g_audioTcpState' /work/sysdvr/sysmodule/source/ncm/ncm_device.c
          grep -n 'JoinThread(&g_a7p253NetworkThread);' /work/sysdvr/sysmodule/source/ncm/NCMmode.c
          grep -n 'A7P251UsbTransitionLocked' /work/sysdvr/sysmodule/source/core.c
          grep -n '#define IPAD_USB_IP_ADDRESS 0x0137A8C0u' /work/sysdvr-overlay/source/main.cpp

      - name: Build P2.5.3 and companion interfaces
        run: |
          set -e
          cd /work/sysdvr/sysmodule
          make clean || true
          make -j"$(nproc)" DEFINES="-DFILE_LOGGING=1"
          test -s sysmodule.nsp
          test -s sysmodule.elf
          strings sysmodule.elf | grep 'A7-P2.5.3 raw SD logfile initialized BUILD=P253'
          strings sysmodule.elf | grep 'A7-P2.5.3 dedicated NCM network thread started poll=500us'
          strings sysmodule.elf | grep 'DISCOVERY=UDP19999 NET_THREAD=1 NET_POLL_US=500'
          cd /work/sysdvr/SysDVRConfig
          make clean || true
          make -j"$(nproc)"
          test -s SysDVR-conf.nro
          strings SysDVR-conf.nro | grep 'iPad USB'
          cd /work/sysdvr-overlay
          make clean || true
          make -j"$(nproc)"
          test -s sysdvr-overlay.ovl
          strings sysdvr-overlay.elf | grep 'iPad USB'
          strings sysdvr-overlay.elf | grep 'v1.0.18-P253'

      - name: Package complete SD deployment
        run: |
          set -e
          OUT=/out/a7p253
          CONTENT="$OUT/atmosphere/contents/00FF0000A53BB665"
          mkdir -p "$CONTENT/flags" "$OUT/config/sysdvr" "$OUT/switch/SysDVR" "$OUT/switch/.overlays"
          cp /work/sysdvr/sysmodule/sysmodule.nsp "$CONTENT/exefs.nsp"
          cp /work/sysdvr/sysmodule/toolbox.json "$CONTENT/toolbox.json"
          cp /work/sysdvr/SysDVRConfig/SysDVR-conf.nro "$OUT/switch/SysDVR/SysDVR.nro"
          cp /work/sysdvr-overlay/sysdvr-overlay.ovl "$OUT/switch/.overlays/SysDVR.ovl"
          printf '.\n' > "$CONTENT/flags/boot2.flag"
          printf 'BUILD=P253\nCONFIG_API=18\nMODE_ID_IPAD_USB=5\nUSB_TRANSITION_OFF_MS=1000\nUSB_TRANSITION_TARGET_LOCK=1\nDEFAULT_MODE_UNCHANGED=1\nNETWORK_THREAD=1\nNETWORK_POLL_US=500\nCAPTURE_THREAD_NCM_PUMP=0\nDISCOVERY_UDP_PORT=19999\nDISCOVERY_INTERVAL_MS=2000\nDISCOVERY_IDLE_ONLY=1\nIPAD_USB_DISPLAY_IP=192.168.55.1\nAUDIO_INFLIGHT_SEGMENTS=6\nAUDIO_RTO_LOOPS=40\nAUDIO_RETX_BURST=3\nVIDEO_INFLIGHT_SEGMENTS=24\nVIDEO_RETX_BURST=8\nOVERLAY_VERSION=1.0.18-P253\nORIGINAL_USB_PRESERVED=1\nNTB=16384\nDATAGRAMS=8\n' > "$OUT/config/sysdvr/build_a7p253.txt"
          cd "$OUT"
          zip -r /out/SysDVR-A7P253_DEDICATED_NCM_THREAD.zip atmosphere config switch

      - name: Verify deployment ZIP
        run: |
          set -e
          ZIP=/out/SysDVR-A7P253_DEDICATED_NCM_THREAD.zip
          unzip -t "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^switch/.overlays/SysDVR.ovl$')" = 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^switch/SysDVR/SysDVR.nro$')" = 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^atmosphere/contents/00FF0000A53BB665/exefs.nsp$')" = 1
          test "$(unzip -Z1 "$ZIP" | grep -Ec '^config/sysdvr/(usb|ipad_usb|ncm|tcp|rtsp)$' || true)" = 0
          unzip -p "$ZIP" config/sysdvr/build_a7p253.txt | grep '^BUILD=P253$'
          unzip -p "$ZIP" config/sysdvr/build_a7p253.txt | grep '^NETWORK_THREAD=1$'
          unzip -p "$ZIP" config/sysdvr/build_a7p253.txt | grep '^CAPTURE_THREAD_NCM_PUMP=0$'
          unzip -p "$ZIP" config/sysdvr/build_a7p253.txt | grep '^IPAD_USB_DISPLAY_IP=192.168.55.1$'
          unzip -p "$ZIP" config/sysdvr/build_a7p253.txt | grep '^ORIGINAL_USB_PRESERVED=1$'
          sha256sum "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: SysDVR-A7P253-Dedicated-NCM-Thread
          path: /out/SysDVR-A7P253_DEDICATED_NCM_THREAD.zip
          if-no-files-found: error
