name: Build A7 P2.1.1 SysDVR USB NCM Performance Reliability

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_ipad_a7_p21_perf_reliability.yml'
      - 'scripts/a7_p21_perf_reliability_patch.py'
      - 'scripts/a7_p211_runtime_marker_patch.py'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip python3 binutils

      - name: Clone official SysDVR 6.3
        run: |
          git clone https://github.com/exelix11/SysDVR.git /work/sysdvr
          cd /work/sysdvr
          git checkout v6.3
          git rev-parse HEAD

      - name: Build validated NCM reference source
        run: |
          git clone https://github.com/Insektaure/SysDVR-UVC-Capture.git /work/ncmref
          cd /work/ncmref
          git checkout d7212ca0942e2782c65c6002d85364687d73c9df
          python3 "$GITHUB_WORKSPACE/scripts/a7_p0_ncm_diag_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p01_ncm_rx_fix_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p02_ncm_ipv4_poc_patch.py" /work/ncmref

      - name: Apply A7 P1 P2 P2.1 and P2.1.1 patches
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_ncm_tcp_video_patch.py" /work/sysdvr/sysmodule /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_filelogging_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_audio_ipc_logging_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_compile_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p21_perf_reliability_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p211_runtime_marker_patch.py" /work/sysdvr/sysmodule

      - name: Verify A7 P2.1.1 architecture
        run: |
          set -e
          cd /work/sysdvr/sysmodule
          grep -n 'NCM_NTB_MAX_SIZE    16384u' source/ncm/ncm_device.c
          grep -n 'NCM_MAX_DATAGRAMS   8u' source/ncm/ncm_device.c
          grep -n 'A7P21_AGG_MAX_FRAMES 8u' source/ncm/ncm_device.c
          grep -n '_a7p21FlushAggUnlocked' source/ncm/ncm_device.c
          grep -n '_a7p21FlushQueuedTx' source/ncm/ncm_device.c
          grep -n 'A7-P2.1.1 NCM ready: NTB=16384 datagrams=8;' source/ncm/ncm_device.c
          grep -n 'A7-P2.1.1 raw SD logfile initialized BUILD=P211' source/core.c
          grep -n 'A7-P2.1.1 SysDVR 6.3 + USB-NCM aggregated A/V mode starting BUILD=P211' source/ncm/NCMmode.c
          if grep -q 'LOG("A7-P1 NCM OUT armed' source/ncm/ncm_device.c; then
            echo 'hot-path NCM OUT armed log still present'
            exit 1
          fi
          grep -n 'A7-P2 TCP 9922 established' source/ncm/ncm_device.c
          grep -n 'ProtoHandshakeAccept_Audio' source/ncm/ncm_device.c
          grep -n 'ProtoHandshakeAccept_Video' source/ncm/ncm_device.c
          grep -n 'IpcThread();' source/sysmodule/main.c
          grep -n 'const StreamMode TCP_MODE' source/modes/TCPmode.c
          grep -n 'const StreamMode USB_MODE' source/modes/USBmode.c
          grep -n 'const StreamMode RTSP_MODE' source/modes/RTSPmode.c

      - name: Build A7 P2.1.1 with FileLogging
        run: |
          set -e
          cd /work/sysdvr/sysmodule
          make clean || true
          make -j"$(nproc)" DEFINES="-DFILE_LOGGING=1"
          test -s sysmodule.nsp
          strings sysmodule.nsp | grep 'SYSDVR_BUILD_FULL/6.3/03'
          strings sysmodule.elf | grep 'A7-P2.1.1 raw SD logfile initialized BUILD=P211'
          strings sysmodule.elf | grep 'A7-P2.1.1 NCM ready: NTB=16384 datagrams=8;'
          strings sysmodule.elf | grep 'A7-P2.1.1 SysDVR 6.3 + USB-NCM aggregated A/V mode starting BUILD=P211'
          if strings sysmodule.elf | grep -q 'A7-P1 NCM OUT armed'; then
            echo 'compiled binary still contains hot-path NCM OUT armed marker'
            exit 1
          fi

      - name: Package drop-in build
        run: |
          set -e
          OUT=/out/a7p211
          CONTENT="$OUT/atmosphere/contents/00FF0000A53BB665"
          mkdir -p "$CONTENT/flags" "$OUT/config/sysdvr"
          cp /work/sysdvr/sysmodule/sysmodule.nsp "$CONTENT/exefs.nsp"
          cp /work/sysdvr/sysmodule/toolbox.json "$CONTENT/toolbox.json"
          printf '.\n' > "$CONTENT/flags/boot2.flag"
          printf '.\n' > "$OUT/config/sysdvr/ncm"
          printf 'BUILD=P211\nNTB=16384\nDATAGRAMS=8\n' > "$OUT/config/sysdvr/build_a7p211.txt"
          cd "$OUT"
          zip -r /out/SysDVR-A7P211_SysDVR63_USB_NCM_PERF_RELIABILITY_DEPLOY_VERIFY.zip atmosphere config

      - name: Verify package
        run: |
          set -e
          ZIP=/out/SysDVR-A7P211_SysDVR63_USB_NCM_PERF_RELIABILITY_DEPLOY_VERIFY.zip
          unzip -l "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^atmosphere/contents/00FF0000A53BB665/exefs.nsp$')" = 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^config/sysdvr/ncm$')" = 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^config/sysdvr/build_a7p211.txt$')" = 1
          unzip -p "$ZIP" config/sysdvr/build_a7p211.txt | grep '^BUILD=P211$'
          sha256sum "$ZIP"

      - name: Upload A7 P2.1.1
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-A7P211-SysDVR63-USB-NCM-PERF-RELIABILITY-DEPLOY-VERIFY
          path: /out/SysDVR-A7P211_SysDVR63_USB_NCM_PERF_RELIABILITY_DEPLOY_VERIFY.zip
          if-no-files-found: error
