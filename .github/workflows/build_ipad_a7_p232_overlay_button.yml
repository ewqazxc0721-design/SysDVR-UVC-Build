name: Build A7 P2.3.2 Overlay iPad USB Button

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_ipad_a7_p232_overlay_button.yml'
      - 'scripts/a7_p232_overlay_ipad_usb_patch.py'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip python3 binutils

      - name: Clone pinned sources
        run: |
          git clone https://github.com/exelix11/SysDVR.git /work/sysdvr
          git -C /work/sysdvr checkout v6.3
          git clone https://github.com/Insektaure/SysDVR-UVC-Capture.git /work/ncmref
          git -C /work/ncmref checkout d7212ca0942e2782c65c6002d85364687d73c9df
          git clone https://github.com/Hartie95/sysdvr-overlay.git /work/sysdvr-overlay
          git -C /work/sysdvr-overlay checkout 8aded84c262cc59b91118c194f53c911100d154d
          git -C /work/sysdvr-overlay submodule update --init --recursive

      - name: Apply patches through P2.3.2
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/a7_p0_ncm_diag_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p01_ncm_rx_fix_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p02_ncm_ipv4_poc_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_ncm_tcp_video_patch.py" /work/sysdvr/sysmodule /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_filelogging_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_audio_ipc_logging_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_compile_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p21_perf_reliability_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p211_runtime_marker_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p212_control_flush_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p22_tcp_retransmit_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p221_burst_retransmit_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p23_ipad_usb_mode_patch.py" /work/sysdvr
          python3 "$GITHUB_WORKSPACE/scripts/a7_p231_config_api18_compat_patch.py" /work/sysdvr
          python3 "$GITHUB_WORKSPACE/scripts/a7_p232_overlay_ipad_usb_patch.py" /work/sysdvr-overlay

      - name: Verify source integration
        run: |
          set -e
          grep -n '#define SYSDVR_IPC_VERSION 18' /work/sysdvr/sysmodule/source/modes/defines.h
          grep -n '#define TYPE_MODE_IPAD_USB 5' /work/sysdvr/sysmodule/source/modes/defines.h
          grep -n '#define TYPE_MODE_IPAD_USB 5' /work/sysdvr-overlay/source/main.cpp
          grep -n 'ListItem("iPad USB")' /work/sysdvr-overlay/source/main.cpp
          grep -n 'getModeLambda(TYPE_MODE_IPAD_USB)' /work/sysdvr-overlay/source/main.cpp
          grep -n 'case TYPE_MODE_IPAD_USB' /work/sysdvr-overlay/source/main.cpp
          grep -n 'APP_VERSION :=.*1.0.16-P232' /work/sysdvr-overlay/Makefile

      - name: Build sysmodule settings app and overlay
        run: |
          set -e
          cd /work/sysdvr/sysmodule
          make clean || true
          make -j"$(nproc)" DEFINES="-DFILE_LOGGING=1"
          test -s sysmodule.nsp
          strings sysmodule.elf | grep 'A7-P2.3.1 raw SD logfile initialized BUILD=P231'
          strings sysmodule.elf | grep 'A7-P2.3.1 iPad USB mode starting BUILD=P231'
          cd /work/sysdvr/SysDVRConfig
          make clean || true
          make -j"$(nproc)"
          test -s SysDVR-conf.nro
          strings SysDVR-conf.nro | grep 'iPad USB'
          cd /work/sysdvr-overlay
          make clean || true
          make -j"$(nproc)"
          test -s sysdvr-overlay.ovl
          strings sysdvr-overlay.ovl | grep 'iPad USB'
          strings sysdvr-overlay.ovl | grep 'v1.0.16-P232'

      - name: Package complete SD deployment
        run: |
          set -e
          OUT=/out/a7p232
          CONTENT="$OUT/atmosphere/contents/00FF0000A53BB665"
          mkdir -p "$CONTENT/flags" "$OUT/config/sysdvr" "$OUT/switch/SysDVR" "$OUT/switch/.overlays"
          cp /work/sysdvr/sysmodule/sysmodule.nsp "$CONTENT/exefs.nsp"
          cp /work/sysdvr/sysmodule/toolbox.json "$CONTENT/toolbox.json"
          cp /work/sysdvr/SysDVRConfig/SysDVR-conf.nro "$OUT/switch/SysDVR/SysDVR.nro"
          cp /work/sysdvr-overlay/sysdvr-overlay.ovl "$OUT/switch/.overlays/SysDVR.ovl"
          printf '.\n' > "$CONTENT/flags/boot2.flag"
          printf '.\n' > "$OUT/config/sysdvr/ipad_usb"
          printf 'BUILD=P232\nSYSMODULE_BUILD=P231\nCONFIG_API=18\nNRO_MODE_BUTTON=IPAD_USB\nOVERLAY_MODE_BUTTON=IPAD_USB\nMODE_ID=5\nORIGINAL_USB_PRESERVED=1\nOVERLAY_VERSION=1.0.16-P232\nNTB=16384\nDATAGRAMS=8\nCONTROL_FLUSH=1\nRETX_RING=32\nRTO_LOOPS=25\nRETX_BURST=8\nMAX_RETRIES=8\n' > "$OUT/config/sysdvr/build_a7p232.txt"
          cd "$OUT"
          zip -r /out/SysDVR-A7P232_OVERLAY_IPAD_USB_BUTTON.zip atmosphere config switch

      - name: Verify deployment ZIP
        run: |
          set -e
          ZIP=/out/SysDVR-A7P232_OVERLAY_IPAD_USB_BUTTON.zip
          unzip -t "$ZIP"
          test "$(unzip -Z1 "$ZIP" | grep -c '^switch/.overlays/SysDVR.ovl$')" = 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^switch/SysDVR/SysDVR.nro$')" = 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^atmosphere/contents/00FF0000A53BB665/exefs.nsp$')" = 1
          unzip -p "$ZIP" switch/.overlays/SysDVR.ovl | strings | grep 'iPad USB'
          unzip -p "$ZIP" switch/.overlays/SysDVR.ovl | strings | grep 'v1.0.16-P232'
          unzip -p "$ZIP" switch/SysDVR/SysDVR.nro | strings | grep 'iPad USB'
          unzip -p "$ZIP" config/sysdvr/build_a7p232.txt | grep '^BUILD=P232$'
          unzip -p "$ZIP" config/sysdvr/build_a7p232.txt | grep '^CONFIG_API=18$'
          unzip -p "$ZIP" config/sysdvr/build_a7p232.txt | grep '^ORIGINAL_USB_PRESERVED=1$'
          sha256sum "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: SysDVR-A7P232-Overlay-iPad-USB-Button
          path: /out/SysDVR-A7P232_OVERLAY_IPAD_USB_BUTTON.zip
          if-no-files-found: error

# P232 reproducible overlay build
