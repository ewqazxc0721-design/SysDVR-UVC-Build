name: Build SysDVR-UVC iPad A6.1 Native H264 Split DIAG

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip python3

      - name: Clone exact upstream baseline
        run: |
          git clone https://github.com/Insektaure/SysDVR-UVC-Capture.git /work/a61
          cd /work/a61
          git checkout d7212ca0942e2782c65c6002d85364687d73c9df

      - name: Apply native UVC 1.5 H264 descriptor patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/work/a61/source/uvc/uvc_device.c')
          s = p.read_text()

          start = s.index('// Video Streaming Class-Specific Descriptors\n')
          end = s.index('// Bulk endpoint for video streaming\n', start)

          replacement = '''// Video Streaming Class-Specific Descriptors
// A6.1: native UVC 1.5 H.264 descriptors. Appended one descriptor at a time
// because usb:ds rejects the combined ~120-byte VS block with ResultInvalidSize.
static struct __attribute__((packed)) {
    UvcVsInputHeaderDescriptor inputHeader;
    UvcFormatH264Descriptor h264Format;
    UvcFrameH264Descriptor h264Frame;
    UvcColorMatchingDescriptor colorMatching;
} g_vsDescriptors = {
    .inputHeader = {
        .bLength = sizeof(UvcVsInputHeaderDescriptor),
        .bDescriptorType = UVC_CS_INTERFACE,
        .bDescriptorSubType = UVC_VS_INPUT_HEADER,
        .bNumFormats = 1,
        .wTotalLength = sizeof(g_vsDescriptors),
        .bEndpointAddress = USB_ENDPOINT_IN | 1,
        .bmInfo = 0,
        .bTerminalLink = UVC_ENTITY_OUTPUT_TERMINAL,
        .bStillCaptureMethod = 0,
        .bTriggerSupport = 0,
        .bTriggerUsage = 0,
        .bControlSize = 1,
        .bmaControls1 = 0,
    },
    .h264Format = {
        .bLength = sizeof(UvcFormatH264Descriptor),
        .bDescriptorType = UVC_CS_INTERFACE,
        .bDescriptorSubType = UVC_VS_FORMAT_H264,
        .bFormatIndex = 1,
        .bNumFrameDescriptors = 1,
        .bDefaultFrameIndex = 1,
        .bMaxCodecConfigDelay = 1,
        .bmSupportedSliceModes = 0,
        .bmSupportedSyncFrameTypes = 0x03,
        .bResolutionScaling = 0,
        .Reserved1 = 0,
        .bmSupportedRateControlModes = 0x01,
        .wMaxMBperSecOneResolutionNoScalability = 108,
    },
    .h264Frame = {
        .bLength = sizeof(UvcFrameH264Descriptor),
        .bDescriptorType = UVC_CS_INTERFACE,
        .bDescriptorSubType = UVC_VS_FRAME_H264,
        .bFrameIndex = 1,
        .wWidth = UVC_VIDEO_WIDTH,
        .wHeight = UVC_VIDEO_HEIGHT,
        .wSARwidth = 1,
        .wSARheight = 1,
        .wProfile = 0x640C,
        .bLevelIDC = 0x20,
        .wConstrainedToolset = 0,
        .bmSupportedUsages = 0x00010003,
        .bmCapabilities = 0x002A,
        .bmSVCCapabilities = 0,
        .bmMVCCapabilities = 0,
        .dwMinBitRate = UVC_MIN_BITRATE,
        .dwMaxBitRate = UVC_MAX_BITRATE,
        .dwDefaultFrameInterval = UVC_FRAME_INTERVAL_30FPS,
        .bNumFrameIntervals = 1,
        .dwFrameInterval1 = UVC_FRAME_INTERVAL_30FPS,
    },
    .colorMatching = {
        .bLength = sizeof(UvcColorMatchingDescriptor),
        .bDescriptorType = UVC_CS_INTERFACE,
        .bDescriptorSubType = UVC_VS_COLORFORMAT,
        .bColorPrimaries = 1,
        .bTransferCharacteristics = 1,
        .bMatrixCoefficients = 4,
    },
};

'''
          s = s[:start] + replacement + s[end:]

          old = "    ctrl->bPreferedVersion = 1;\n    ctrl->bMinVersion = 1;\n    ctrl->bMaxVersion = 1;\n"
          new = old + "    ctrl->bUsage = 0x01;\n    ctrl->bBitDepthLuma = 8;\n    ctrl->bmSettings = 0x2A;\n    ctrl->bMaxNumberOfRefFramesPlus1 = 2;\n    ctrl->bmRateControlModes = 0x0001;\n    ctrl->bmLayoutPerStream = 0;\n"
          if old not in s:
              raise SystemExit('probe/commit anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Split VS descriptor appends for usb:ds size limit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/work/a61/source/uvc/uvc_device.c')
          s = p.read_text()

          high = '''    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_High, &g_vsDescriptors, sizeof(g_vsDescriptors)));
'''
          high_new = '''    // A6.1: append each class-specific VS descriptor separately; usb:ds
    // rejects the combined native-H264 block as ResultInvalidSize (0xCC8C).
    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_High, &g_vsDescriptors.inputHeader, sizeof(g_vsDescriptors.inputHeader)));
    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_High, &g_vsDescriptors.h264Format, sizeof(g_vsDescriptors.h264Format)));
    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_High, &g_vsDescriptors.h264Frame, sizeof(g_vsDescriptors.h264Frame)));
    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_High, &g_vsDescriptors.colorMatching, sizeof(g_vsDescriptors.colorMatching)));
'''
          super_ = '''    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_Super, &g_vsDescriptors, sizeof(g_vsDescriptors)));
'''
          super_new = '''    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_Super, &g_vsDescriptors.inputHeader, sizeof(g_vsDescriptors.inputHeader)));
    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_Super, &g_vsDescriptors.h264Format, sizeof(g_vsDescriptors.h264Format)));
    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_Super, &g_vsDescriptors.h264Frame, sizeof(g_vsDescriptors.h264Frame)));
    R_RET_ON_FAIL(usbDsInterface_AppendConfigurationData(g_uvcCtx.streamingInterface,
        UsbDeviceSpeed_Super, &g_vsDescriptors.colorMatching, sizeof(g_vsDescriptors.colorMatching)));
'''
          if high not in s or super_ not in s:
              raise SystemExit('VS append anchors missing')
          s = s.replace(high, high_new, 1).replace(super_, super_new, 1)

          # Log exact native descriptor sizes before setup so runtime failures are actionable.
          anchor = 'static Result _setupInterfaces5x(void)\n{\n    Result rc = 0;\n'
          repl = anchor + '    LOG("A6.1 VS sizes: header=%u format=%u frame=%u color=%u total=%u\\n", (unsigned)sizeof(g_vsDescriptors.inputHeader), (unsigned)sizeof(g_vsDescriptors.h264Format), (unsigned)sizeof(g_vsDescriptors.h264Frame), (unsigned)sizeof(g_vsDescriptors.colorMatching), (unsigned)sizeof(g_vsDescriptors));\n'
          if anchor not in s:
              raise SystemExit('setup interface anchor missing')
          s = s.replace(anchor, repl, 1)
          p.write_text(s)
          PY

      - name: Add A6.1 raw USB state monitor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/work/a61/source/sysmodule/main.c')
          s = p.read_text()
          marker = 'static volatile bool g_running = true;\n'
          helper = '''\n\nstatic const char* A61UsbStateName(UsbState state)\n{\n    switch (state) {\n        case UsbState_Detached: return "Detached";\n        case UsbState_Attached: return "Attached";\n        case UsbState_Powered: return "Powered";\n        case UsbState_Default: return "Default";\n        case UsbState_Address: return "Address";\n        case UsbState_Configured: return "Configured";\n        case UsbState_Suspended: return "Suspended";\n        default: return "Unknown";\n    }\n}\n'''
          if marker not in s:
              raise SystemExit('g_running marker missing')
          s = s.replace(marker, marker + helper, 1)
          old = '''    // Main thread just sleeps - all work is done in streaming threads\n    while (g_running) {\n        svcSleepThread(1E+9);  // 1 second\n    }\n'''
          new = '''    LOG("A6.1-NATIVE-H264-SPLIT-DIAG raw USB monitor active (1ms poll, 1s heartbeat)\\n");\n    UsbState lastState = (UsbState)0xFF;\n    bool haveState = false;\n    u32 heartbeat = 0, seq = 0;\n    while (g_running) {\n        UsbState state = UsbState_Detached;\n        Result rc = usbDsGetState(&state);\n        if (R_SUCCEEDED(rc)) {\n            if (!haveState || state != lastState) {\n                UsbDeviceSpeed speed = UsbDeviceSpeed_None;\n                Result speedRc = usbDsGetSpeed(&speed);\n                LOG("A6.1 USB state #%u: %u (%s), speed=%u, speedRc=0x%x\\n", seq++, (unsigned)state, A61UsbStateName(state), (unsigned)speed, speedRc);\n                lastState = state; haveState = true;\n            }\n            if (++heartbeat >= 1000) {\n                LOG("A6.1 heartbeat: state=%u (%s)\\n", (unsigned)state, A61UsbStateName(state));\n                heartbeat = 0;\n            }\n        } else {\n            LOG("A6.1 USB get-state ERROR rc=0x%x\\n", rc);\n        }\n        svcSleepThread(1E+6);\n    }\n'''
          if old not in s:
              raise SystemExit('main loop anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Make FileLogging thread-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/work/a61/source/core.c')
          s = p.read_text()
          old = 'static FsFileSystem g_sdCard;\nstatic bool g_sdMounted = false;\n'
          new = 'static FsFileSystem g_sdCard;\nstatic bool g_sdMounted = false;\nstatic Mutex g_fileLogMutex = 0;\n'
          if old not in s:
              raise SystemExit('file logging globals marker missing')
          s = s.replace(old, new, 1)
          start = s.index('void LogFunctionImpl(const char* fmt, ...)\n{', s.index('#elif FILE_LOGGING'))
          end = s.index('\n}\n#endif', start) + 2
          repl = '''void LogFunctionImpl(const char* fmt, ...)\n{\n    if (!g_sdMounted) return;\n    mutexLock(&g_fileLogMutex);\n    char buf[512];\n    va_list args;\n    va_start(args, fmt);\n    int len = vsnprintf(buf, sizeof(buf), fmt, args);\n    va_end(args);\n    if (len > 0) {\n        FsFile file;\n        if (R_SUCCEEDED(fsFsOpenFile(&g_sdCard, "/logfile.txt", FsOpenMode_Write | FsOpenMode_Append, &file))) {\n            s64 offset = 0;\n            fsFileGetSize(&file, &offset);\n            fsFileWrite(&file, offset, buf, len, FsWriteOption_Flush);\n            fsFileClose(&file);\n        }\n    }\n    mutexUnlock(&g_fileLogMutex);\n}'''
          s = s[:start] + repl + s[end:]
          p.write_text(s)
          PY

      - name: Verify A6.1 isolation
        run: |
          set -e
          cd /work/a61
          grep -n 'UVC_VS_FORMAT_H264' source/uvc/uvc_device.c
          grep -n 'UVC_VS_FRAME_H264' source/uvc/uvc_device.c
          grep -n 'g_vsDescriptors.h264Format' source/uvc/uvc_device.c
          grep -n 'g_vsDescriptors.h264Frame' source/uvc/uvc_device.c
          grep -n 'A6.1-NATIVE-H264-SPLIT-DIAG' source/sysmodule/main.c
          grep -n 'usbDsSetBinaryObjectStore' source/uvc/uvc_device.c

      - name: Build A6.1 FileLogging
        run: |
          set -e
          cd /work/a61
          make clean || true
          make -j"$(nproc)" DEFINES="-DFILE_LOGGING"
          test -s exefs.nsp
          OUT=/out/a61/atmosphere/contents/00FF0000A53BB666
          mkdir -p "$OUT"
          cp exefs.nsp "$OUT/exefs.nsp"
          cp toolbox.json "$OUT/toolbox.json"
          cp -R flags "$OUT/flags"
          cd /out/a61
          zip -r /out/SysDVR-UVC-iPad-A61_NATIVE_H264_SPLIT_DIAG_FileLogging.zip atmosphere

      - name: Verify package
        run: |
          ls -lh /out/SysDVR-UVC-iPad-A61_NATIVE_H264_SPLIT_DIAG_FileLogging.zip
          unzip -l /out/SysDVR-UVC-iPad-A61_NATIVE_H264_SPLIT_DIAG_FileLogging.zip

      - name: Upload A6.1
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-UVC-iPad-A61-NATIVE-H264-SPLIT-DIAG-FileLogging
          path: /out/SysDVR-UVC-iPad-A61_NATIVE_H264_SPLIT_DIAG_FileLogging.zip
          if-no-files-found: error
