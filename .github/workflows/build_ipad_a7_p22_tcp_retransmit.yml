name: Build A7 P2.2 SysDVR USB NCM TCP Retransmit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_ipad_a7_p22_tcp_retransmit.yml'
      - 'scripts/a7_p22_tcp_retransmit_patch.py'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git zip python3 binutils

      - name: Clone official SysDVR 6.3
        run: |
          git clone https://github.com/exelix11/SysDVR.git /work/sysdvr
          cd /work/sysdvr
          git checkout v6.3
          git rev-parse HEAD

      - name: Build validated NCM reference source
        run: |
          git clone https://github.com/Insektaure/SysDVR-UVC-Capture.git /work/ncmref
          cd /work/ncmref
          git checkout d7212ca0942e2782c65c6002d85364687d73c9df
          python3 "$GITHUB_WORKSPACE/scripts/a7_p0_ncm_diag_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p01_ncm_rx_fix_patch.py" /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p02_ncm_ipv4_poc_patch.py" /work/ncmref

      - name: Apply A7 P1 through P2.2 patches
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_ncm_tcp_video_patch.py" /work/sysdvr/sysmodule /work/ncmref
          python3 "$GITHUB_WORKSPACE/scripts/a7_p1_sysdvr63_filelogging_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_audio_ipc_logging_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p2_compile_fix.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p21_perf_reliability_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p211_runtime_marker_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p212_control_flush_patch.py" /work/sysdvr/sysmodule
          python3 "$GITHUB_WORKSPACE/scripts/a7_p22_tcp_retransmit_patch.py" /work/sysdvr/sysmodule

      - name: Verify A7 P2.2 architecture
        run: |
          set -e
          cd /work/sysdvr/sysmodule
          grep -n 'A7P22_RETX_RING_SEGMENTS 32u' source/ncm/ncm_device.c
          grep -n '_a7p22VideoRetransmitOldest' source/ncm/ncm_device.c
          grep -n '_a7p22AudioRetransmitOldest' source/ncm/ncm_device.c
          grep -n 'A7-P2.2 video RTO retransmit' source/ncm/ncm_device.c
          grep -n 'A7-P2.2 audio RTO retransmit' source/ncm/ncm_device.c
          grep -n 'A7-P2.2 raw SD logfile initialized BUILD=P22' source/core.c
          grep -n 'A7-P2.2 SysDVR 6.3 + USB-NCM retransmit A/V mode starting BUILD=P22 NTB=16384 DATAGRAMS=8 RING=32 RTO_LOOPS=100' source/ncm/NCMmode.c
          grep -n 'A7-P2.2 NCM ready BUILD=P22: DHCP' source/ncm/NCMmode.c

      - name: Build A7 P2.2 with FileLogging
        run: |
          set -e
          cd /work/sysdvr/sysmodule
          make clean || true
          make -j"$(nproc)" DEFINES="-DFILE_LOGGING=1"
          test -s sysmodule.nsp
          test -s sysmodule.elf
          strings sysmodule.elf | grep 'SYSDVR_BUILD_FULL/6.3/03'
          strings sysmodule.elf | grep 'A7-P2.2 raw SD logfile initialized BUILD=P22'
          strings sysmodule.elf | grep 'A7-P2.2 video RTO retransmit'
          strings sysmodule.elf | grep 'A7-P2.2 audio RTO retransmit'

      - name: Package drop-in build
        run: |
          set -e
          OUT=/out/a7p22
          CONTENT="$OUT/atmosphere/contents/00FF0000A53BB665"
          mkdir -p "$CONTENT/flags" "$OUT/config/sysdvr"
          cp /work/sysdvr/sysmodule/sysmodule.nsp "$CONTENT/exefs.nsp"
          cp /work/sysdvr/sysmodule/toolbox.json "$CONTENT/toolbox.json"
          printf '.\n' > "$CONTENT/flags/boot2.flag"
          printf '.\n' > "$OUT/config/sysdvr/ncm"
          printf 'BUILD=P22\nNTB=16384\nDATAGRAMS=8\nCONTROL_FLUSH=1\nRETX_RING=32\nRTO_LOOPS=100\nMAX_RETRIES=8\n' > "$OUT/config/sysdvr/build_a7p22.txt"
          cd "$OUT"
          zip -r /out/SysDVR-A7P22_SysDVR63_USB_NCM_TCP_RETRANSMIT.zip atmosphere config

      - name: Verify package
        run: |
          set -e
          ZIP=/out/SysDVR-A7P22_SysDVR63_USB_NCM_TCP_RETRANSMIT.zip
          unzip -t "$ZIP"
          unzip -p "$ZIP" config/sysdvr/build_a7p22.txt | grep '^BUILD=P22$'
          unzip -p "$ZIP" config/sysdvr/build_a7p22.txt | grep '^RETX_RING=32$'
          sha256sum "$ZIP"

      - name: Upload A7 P2.2
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-A7P22-SysDVR63-USB-NCM-TCP-RETRANSMIT
          path: /out/SysDVR-A7P22_SysDVR63_USB_NCM_TCP_RETRANSMIT.zip
          if-no-files-found: error

